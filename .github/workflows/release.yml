name: Release

# Publishes release vX.Y when the first CHANGELOG.md heading is a version
# ("## Version 1.1 — October 23, 2026" or "## 1.1") that has no release yet.
# File names stay the same every version, so ".../releases/latest/download/..."
# links always point at the newest one. Run it by hand with "refresh" to
# replace the files of the current version's release (for example after a
# rename).
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      refresh:
        description: "Replace the files of the existing release for the top version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: v
        run: |
          ver=$(grep -m1 '^## ' CHANGELOG.md | sed -E 's/^## +(Version +)?([0-9][0-9.]*).*/\2/')
          [[ "$ver" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "the top CHANGELOG heading is not a version"; exit 0; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          awk '/^## /{n++; next} n==1' CHANGELOG.md > notes.md
          if gh release view "v$ver" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - name: Build the downloads
        if: steps.v.outputs.version != ''
        run: |
          mkdir dist
          cp Strikers-Charged-Vita.vpk cboc-release.json dist/
          git archive --format=zip --prefix=Strikers-Charged-Vita/ -o dist/Strikers-Charged-Vita-install.zip HEAD
          (cd dist && sha256sum Strikers-Charged-Vita.vpk Strikers-Charged-Vita-install.zip cboc-release.json > SHA256SUMS.txt)
      - name: Publish
        if: steps.v.outputs.version != '' && steps.v.outputs.exists != '1'
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/* \
            --title "Mario Strikers Charged ${{ steps.v.outputs.version }}" \
            --notes-file notes.md --target "$GITHUB_SHA" --latest
      - name: Refresh the existing release's files
        if: steps.v.outputs.exists == '1' && inputs.refresh
        run: |
          tag="v${{ steps.v.outputs.version }}"
          gh release upload "$tag" dist/* --clobber
          keep=" $(cd dist && ls | tr '\n' ' ') "
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
            case "$keep" in *" $name "*) ;; *) gh release delete-asset "$tag" "$name" --yes && echo "removed $name";; esac
          done
